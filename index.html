}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0}.hsearch{width:100%;box-sizing:border-box;padding:.5rem .7rem;border-radius:10px;border:1px solid var(--line,#3a3a55);background:transparent;color:inherit;font:inherit;margin:.3rem 0}

.tblwrap{overflow-x:auto}.compare table{border-collapse:collapse;width:100%;font-size:.85em}.compare th,.compare td{padding:.3rem .4rem;border-bottom:1px solid var(--line,#3a3a5555);text-align:start}
canvas.chart{width:100%;height:auto;max-width:100%}.sel{padding:.3rem;border-radius:8px;background:transparent;color:inherit;border:1px solid var(--line,#3a3a55)}
.gcols,.gcol-l,.gcol-r{display:contents}

  #app{max-width:1240px}

@media (min-width:1000px) and (max-height:760px){.screen.game .gcol-l{position:static}}
.memorial-fs{animation:memIn .9s ease both}
@keyframes memIn{from{opacity:0}to{opacity:1}}
.memorial-fs .mem-fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.memorial-fs>*:not(.mem-fx){position:relative;z-index:1}
.memorial-fs .mem-stage-wrap,.memorial-fs .mem-age,.memorial-fs .mem-text{transition:opacity .38s ease,transform .38s ease,filter .38s ease}
.memorial-fs.swap .mem-stage-wrap{opacity:0;transform:scale(.97);filter:blur(3px)}
.memorial-fs.swap .mem-age,.memorial-fs.swap .mem-text{opacity:0}
.memorial-fs .mem-stage-wrap{box-shadow:0 0 60px rgba(255,190,110,.14),0 10px 32px rgba(0,0,0,.4)}
.memorial-fs .mem-dots{display:flex;gap:7px;justify-content:center;flex-shrink:0}
.memorial-fs .mem-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .4s}
.memorial-fs .mem-dots i.past{background:rgba(255,214,140,.7)}
.memorial-fs .mem-dots i.now{background:#ffd9a0;transform:scale(1.5);box-shadow:0 0 8px #ffd9a0}
.memorial-fs.closing{animation:memOut 1.4s ease forwards}
@keyframes memOut{to{opacity:0;filter:brightness(.4)}}
@media (prefers-reduced-motion:reduce){.memorial-fs,.memorial-fs.closing{animation:none}.memorial-fs .mem-stage-wrap,.memorial-fs .mem-age,.memorial-fs .mem-text{transition:none}}
.pb-ctl .btn{white-space:nowrap;padding-inline:8px}
.dec-modal .modal-card.decision{width:min(94vw,460px);max-height:86vh}
.dec-modal .btn.choice{display:flex;flex-direction:column;align-items:flex-start;width:100%;margin-top:8px;text-align:start}
.dec-modal .btn.ghost{margin-top:10px;width:100%;background:none;border:1px dashed var(--line,#8886);color:inherit;opacity:.8}
.decision-btn{width:100%;margin-bottom:8px;animation:decPulse 1.6s ease-in-out infinite}
@keyframes decPulse{50%{box-shadow:0 0 0 4px rgba(255,200,90,.35)}}
.shopitem.off{opacity:.5}
@media (prefers-reduced-motion:reduce){.decision-btn{animation:none}}
.frow{display:flex;align-items:center;gap:8px;padding:3px 0}
.fam-rowface,.fam-tipface{width:34px;height:34px;flex:none;image-rendering:pixelated;background:rgba(0,0,0,.18);border-radius:8px}
.fam-rowface.dead,.frow.gone{filter:grayscale(1);opacity:.6}
.fam-head{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.modal{z-index:1000!important}
.fam,.fam-tip{z-index:5}
.stage-badge{inset-block-start:6px!important;inset-block-end:auto!important}
.mem-text[data-moment]::before{content:attr(data-moment) " · ";color:#ffd9a0}
.page-foot{text-align:center;margin:18px 0 8px;opacity:.7}
.money-chip{position:absolute;left:6px;bottom:6px;z-index:6;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:4px 8px;border-radius:10px;border:2px solid rgba(255,255,255,.35);background:rgba(20,22,40,.72);color:#ffe9a8;font:inherit;line-height:1.25;cursor:pointer;backdrop-filter:blur(3px)}
.money-chip b{font-size:.9rem;direction:ltr}

.bal-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 0}
